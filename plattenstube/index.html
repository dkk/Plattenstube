<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Plattenstube</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
/* Layout: the room fills the screen; a search drawer sits at the top, the collection list on the right. */
:root{
  --bg:#1a1410; --panel:#2a211a; --panel2:#3a2d22; --line:#5a4632;
  --fg:#f1e4c8; --muted:#b59d7a; --accent:#e5a24a; --good:#8fc46a; --bad:#e06b5a;
  --display:"Silkscreen","VT323",monospace; --body:"VT323","Courier New",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:20px;line-height:1.2;display:flex;flex-direction:column;overflow:hidden}
button,input{font-family:inherit;font-size:inherit;color:inherit}
header{position:relative;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:3px solid var(--line);z-index:30}
header h1{font-family:var(--display);font-size:16px;margin:0;letter-spacing:1px;color:var(--accent)}
.search{position:relative;flex:1 1 280px;min-width:0}
.search input{width:100%;background:var(--bg);border:3px solid var(--line);padding:6px 10px;outline:none;image-rendering:pixelated}
.search input:focus{border-color:var(--accent)}
.results{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--panel2);border:3px solid var(--line);max-height:60vh;overflow:auto;display:none}
.results.open{display:block}
.result{display:flex;gap:10px;align-items:center;padding:6px 8px;border-bottom:2px solid var(--line);cursor:pointer}
.result:hover,.result:focus{background:var(--panel)}
.result img{width:40px;height:40px;image-rendering:pixelated;flex:none;background:#000}
.result .t{min-width:0;flex:1}
.result .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result .t span{color:var(--muted)}
.result .add{font-family:var(--display);font-size:10px;background:var(--accent);color:#1a1410;border:0;padding:6px 8px;cursor:pointer;flex:none}
.result .add[disabled]{background:var(--muted);cursor:default}
.status{color:var(--muted);min-height:1.2em;flex:1 1 100%}
.stage{position:relative}
#bubble{position:absolute;z-index:4;pointer-events:none;max-width:300px;background:rgb(165,105,57);border:3px solid rgb(81,49,25);color:#f1e4c8;font-family:var(--body);font-size:19px;line-height:1.1;padding:7px 10px;image-rendering:pixelated;transition:opacity .5s}
#bubble .tail{position:absolute;left:var(--tail,24px);bottom:-14px;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:12px solid rgb(81,49,25)}
#bubble .tail::after{content:"";position:absolute;left:-4px;top:-13px;border-left:4px solid transparent;border-right:4px solid transparent;border-top:8px solid rgb(165,105,57)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(26,20,16,.55)}
.overlay .hint{color:var(--muted);font-size:17px}
.primary.big{font-size:14px;padding:14px 22px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.foot{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:8px 12px;border-top:3px solid var(--line);margin-top:auto}
.testpanel{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px;z-index:5;background:rgba(26,20,16,.7);padding:6px;border:2px solid var(--line)}
.testpanel b{font-family:var(--display);font-size:9px;color:var(--muted)}
.testpanel .adminTitle{margin-top:8px;padding-top:6px;border-top:2px solid var(--line)}
.testpanel button{background:var(--panel2);border:2px solid var(--line);color:var(--fg);padding:1px 6px;font-size:15px;cursor:pointer;text-align:left}
.whoRow{display:flex;gap:8px;align-items:center;width:100%;min-width:0}
.whoRow .hint{color:var(--muted)}
.whoRow #who{color:var(--accent);flex:1;min-width:0;overflow-wrap:anywhere}
.settings{position:absolute;top:100%;right:max(16px,env(safe-area-inset-right,0px));width:min(640px,calc(100% - 32px));background:var(--bg);border:3px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.5)} /* floats over the room instead of pushing it down */
.settings label{color:var(--muted)}
.settings input{background:var(--panel);border:3px solid var(--line);padding:6px 10px;outline:none;width:100%}
.settings .hint{color:var(--muted);font-size:17px;line-height:1.3}
.settings code{color:var(--fg);background:var(--panel2);padding:0 4px;user-select:all;word-break:break-all}
.settings .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.primary{font-family:var(--display);font-size:10px;background:#1db954;color:#0b2914;border:0;padding:8px 12px;cursor:pointer}
.primary[disabled]{background:var(--muted);cursor:default}
.mini{background:var(--panel2);border:2px solid var(--line);padding:2px 8px;cursor:pointer;font-size:17px}
main{flex:1;display:flex;min-height:0}
.stage{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#2c2219 0%,#1a1410 70%)}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;max-width:100%;max-height:100%;cursor:pointer}
aside{width:260px;flex:none;background:var(--panel);border-left:3px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside h2{font-family:var(--display);font-size:11px;margin:0;padding:10px 12px;border-bottom:3px solid var(--line);color:var(--muted);letter-spacing:1px}
.pick{padding:10px 12px;border-bottom:3px solid var(--line);height:104px;box-sizing:border-box;overflow:hidden;display:flex;gap:10px;align-items:flex-start}
.pick img{width:72px;height:72px;image-rendering:pixelated;background:#000;flex:none;border:3px solid var(--line)}
.pick .t{min-width:0}
.pick .t b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--accent);line-height:1.1}
.pick .t span{color:var(--muted);display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick-empty{color:var(--muted)}
.now{padding:10px 12px;min-height:60px}
.now .t{min-width:0}
.now b{color:var(--accent);display:block;line-height:1.1}
.now .track{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now .artist{color:var(--muted)}
.vol{padding:4px 12px 10px;border-bottom:3px solid var(--line);display:flex;flex-direction:column;gap:8px}
.vol .btnRow{display:flex;gap:8px}
.vol .btnRow button:disabled{opacity:.45;cursor:default}
.vol #volhint{color:var(--muted);font-size:17px}
.vol label{display:flex;align-items:center;gap:8px;width:100%;min-width:0}
.vol label .hint{color:var(--muted);flex:none}
.vol #volpct{color:var(--accent);flex:none;min-width:2.6em;text-align:right;font-variant-numeric:tabular-nums}
.vol input[type=range]{flex:1 1 0;min-width:0;width:0;margin:0;accent-color:var(--accent);cursor:pointer}
.shelf{overflow:auto;flex:1}
.album{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:2px solid var(--line);cursor:pointer}
.album:hover{background:var(--panel2)}
.album.playing{background:#3d2d14}
.album.hover{background:var(--panel2)}
.album img{width:36px;height:36px;image-rendering:pixelated;background:#000;flex:none}
.album .t{min-width:0;flex:1}
.album .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.album .t span{color:var(--muted);font-size:17px}
.album .x{background:none;border:0;color:var(--muted);cursor:pointer;padding:4px}
body:not(.owner) .search,body:not(.owner) .album .x,body:not(.owner) #share,body:not(.owner) #export,body:not(.owner) #reload,body:not(.owner) .testpanel{display:none}  /* guests get the owner's collection and cannot change it */
.album .x:hover{color:var(--bad)}
.empty{padding:14px 12px;color:var(--muted)}
@media (max-width:700px){
  main{flex-direction:column}
  aside{width:auto;border-left:0;border-top:3px solid var(--line);max-height:42%}
}
</style>
</head>
<body>
<header>
  <h1>PLATTENSTUBE</h1>
  <div class="search">
    <input id="q" type="search" placeholder="Search album or artist… e.g. Kind of Blue Miles Davis" autocomplete="off">
    <div class="results" id="results"></div>
  </div>
</header>
<main>
  <div class="stage"><canvas id="c"></canvas>
    <div id="bubble" hidden><div class="txt"></div><div class="tail"></div></div>
    <div class="testpanel" id="testpanel">
      <b>TEST</b>
      <button data-t="day">day</button><button data-t="sunset">sunset</button><button data-t="dusk">dusk</button><button data-t="night">night</button><button data-t="realtime">real time</button>
      <button data-t="lamp">toggle lamp (he walks)</button>
      <button data-t="end">end of side</button>
      <button data-t="doze">doze off</button>
      <button data-t="wake">wake (pick record)</button>
      <button data-t="catwake">cat wakes</button>
      <button data-t="crackle">crackle</button>
      <button data-t="her-cat">her: cat</button><button data-t="her-read">her: read</button><button data-t="her-candle">her: candle</button><button data-t="her-talk">her: talk</button>
      <b class="adminTitle">ADMIN</b>
      <button id="share" title="Anyone who opens the link gets these records added to their cabinet">copy collection link</button>
      <button id="export" title="Download collection.json — put it next to index.html on the server and every guest gets this collection">save collection file</button>
      <button id="reload" title="Empty the cabinet in this browser and load collection.json again">reload collection</button>
      <button id="savebooks" title="Look up every book, fetch its cover and download books.json — put it next to index.html">save book data</button>
    </div>
    <div class="overlay" id="overlay"><button id="connect" class="primary big">Connect to Spotify</button><div class="hint">Needs Spotify Premium. The room fills once you are in.</div></div>
  </div>
  <aside>
    <h2>PICKED</h2>
    <div class="pick" id="pick"><div class="pick-empty">Hover a record or a book to see what it is. Click a record and he puts it on.</div></div>
    <h2>NOW PLAYING</h2>
    <div class="now" id="now"><span style="color:var(--muted)">Nothing yet. Pick a record from the cabinet.</span></div>
    <div class="vol" id="vol">
      <div class="btnRow"><button id="stop" class="mini" disabled>Stop</button><button id="next" class="mini" title="He puts this record back and picks another one at random">Next album</button></div>
      <label id="vollabel"><span class="hint">Volume</span><span id="volpct">80%</span><input id="volslider" type="range" min="0" max="100" step="1" value="80"></label>
      <span id="volhint" class="hint" hidden>he is on his way to the record player…</span>
    </div>
    <h2>RECORD CABINET</h2>
    <div class="shelf" id="shelf"></div>
    <div class="foot">
      <div class="whoRow"><span class="hint">Spotify:</span><span id="who"></span></div>
      <button id="disconnect" class="mini" hidden>Log out</button>
    </div>
  </aside>
</main>

<script src="https://sdk.scdn.co/spotify-player.js"></script>
<script>
/* ---------- data ---------- */
const COLS = 5, ROWS = 3, PER = 7, SLOTS = COLS*ROWS*PER; // 105 records
let albums = [];
try { albums = JSON.parse(localStorage.getItem('plattenstube') || '[]'); } catch (e) { albums = []; }
function sortKey(a){ return (a.artist || '').toLowerCase().replace(/^(the|die|der|das|les|los|las|el|la)\s+/, ''); }
function sortAlbums(){ albums.sort((a, b) => sortKey(a).localeCompare(sortKey(b), 'de') || (a.year || '').localeCompare(b.year || '') || a.title.localeCompare(b.title, 'de')); }
/* guest view: open plattenstube.html?guest (or #guest) to see the page exactly as invited people see it; your own cabinet is left untouched */
let guestView = false;
try { // ?guest in the address → guest view; it only survives the Spotify login round trip, a plain address is your own cabinet again
  if (/[?&#]guest\b/.test(location.search + location.hash)) sessionStorage.setItem('plattenstube.guest', '1');
  else if (!/[?&]code=/.test(location.search)) sessionStorage.removeItem('plattenstube.guest');
  guestView = sessionStorage.getItem('plattenstube.guest') === '1';
} catch (e) {}
function save(){ if (guestView) return; try { localStorage.setItem('plattenstube', JSON.stringify(albums)); } catch (e) {} }

const imgCache = {};
function coverImage(a){
  if (imgCache[a.id]) return imgCache[a.id];
  if (a.colorV !== COLOR_VERSION) a.color = null;                 // colour chosen by an older method: redone once the image is in
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => { a.color = dominant(img); a.colorV = COLOR_VERSION; draw(); };
  img.onerror = () => { const i2 = new Image(); i2.onload = draw; i2.src = a.cover; imgCache[a.id] = i2; };
  img.src = a.cover;
  imgCache[a.id] = img;
  return img;
}
function fallbackColor(id){ let h=0; for (const c of String(id)) h=(h*31+c.charCodeAt(0))>>>0; return `hsl(${h%360},45%,${38+(h>>8)%18}%)`; }
const COLOR_VERSION = 4;                                        // bump when the way a cover's colour is chosen changes, so stored colours get redone
function dominant(img){ // the cover's colour: sort the coloured pixels into buckets (hue × lightness) and take the fullest bucket
  try {
    const N = 32, t = document.createElement('canvas'); t.width = t.height = N;
    const x = t.getContext('2d'); x.drawImage(img, 0, 0, N, N);
    const d = x.getImageData(0, 0, N, N).data, col = {}, grey = {};
    for (let i = 0; i < d.length; i += 4) {
      const r = d[i], g = d[i+1], b = d[i+2], max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 510, c = (max - min) / 255;
      const sat = c === 0 ? 0 : c / (1 - Math.abs(2*l - 1));
      let key, store;
      if (sat >= 0.2 && l >= 0.1 && l <= 0.92) {                                             // a coloured pixel: 24 hue bands × 3 lightness bands
        const h = max === r ? ((g - b) / (max - min) + 6) % 6 : max === g ? (b - r) / (max - min) + 2 : (r - g) / (max - min) + 4;
        key = Math.floor(h * 4) + ':' + Math.floor(l * 3); store = col;
      } else { key = 'g' + Math.floor(l * 8); store = grey; }                                 // greys, blacks, whites by lightness only
      const bk = store[key] || (store[key] = { n: 0, r: 0, g: 0, b: 0 }); bk.n++; bk.r += r; bk.g += g; bk.b += b;
    }
    const n = d.length / 4, coloured = Object.values(col).reduce((s, bk) => s + bk.n, 0);
    const pool = coloured >= n * 0.02 ? col : grey;                                        // colour wins whenever the cover has any to speak of
    let best = null; for (const k in pool) if (!best || pool[k].n > best.n) best = pool[k];
    let r = best.r / best.n, g = best.g / best.n, b = best.b / best.n;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 510;
    const f = l < 0.22 ? 0.22 / Math.max(l, 0.02) : l > 0.65 ? 0.65 / l : 1;             // keep it readable as a spine: not pitch black, not pastel
    return `rgb(${Math.min(255, r*f)|0},${Math.min(255, g*f)|0},${Math.min(255, b*f)|0})`;
  } catch (e) { return null; }
}

/* ---------- Spotify auth (Authorization Code + PKCE, no server) ---------- */
const REDIRECT = location.origin + location.pathname.replace(/index\.html$/, '');   // …/plattenstube/ and …/plattenstube/index.html are the same page for Spotify
const SCOPES = 'streaming user-read-email user-read-private user-modify-playback-state user-read-playback-state';
let auth = null;
try { auth = JSON.parse(localStorage.getItem('plattenstube.auth') || 'null'); } catch (e) {}
const CLIENT_ID = '5f58f8127f9d424296ddae7aeb606d5c';
const OWNER_ID = 'dklock';                    // only this Spotify account can change the collection; everyone else sees the owner's records (collection.json next to this file)
let isOwner = false;
const overlay = document.getElementById('overlay');
function saveAuth(){ try { auth ? localStorage.setItem('plattenstube.auth', JSON.stringify(auth)) : localStorage.removeItem('plattenstube.auth'); } catch (e) {} }

function b64url(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
async function login(){
  const cid = CLIENT_ID;
  if (location.protocol === 'file:') { setStatus('Spotify cannot redirect back to a file:// page. Serve this file over http://127.0.0.1 (see instructions).'); return; }
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(64)));
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  sessionStorage.setItem('plattenstube.verifier', verifier);
  const p = new URLSearchParams({ client_id: cid, response_type: 'code', redirect_uri: REDIRECT, scope: SCOPES, code_challenge_method: 'S256', code_challenge: challenge });
  location.href = 'https://accounts.spotify.com/authorize?' + p;
}
async function tokenRequest(body){
  const r = await fetch('https://accounts.spotify.com/api/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams(body) });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error_description || d.error || 'token error');
  auth = { access: d.access_token, refresh: d.refresh_token || (auth && auth.refresh), exp: Date.now() + (d.expires_in - 60) * 1000 };
  saveAuth();
}
/* ---------- collection links: #c=<album id>,<album id>,… (Spotify album ids) ---------- */
function collectionLink(){ return REDIRECT + '#c=' + albums.map(a => a.id).join(','); }
function pendingImportFromHash(){
  if (/[?&#]guest\b/.test(location.search + location.hash) && !/code=/.test(location.search)) history.replaceState(null, '', REDIRECT);
  const m = /[#&]c=([A-Za-z0-9,]+)/.exec(location.hash);
  if (!m) return;
  try { sessionStorage.setItem('plattenstube.import', m[1]); } catch (e) {}
  history.replaceState(null, '', REDIRECT);
}
async function fetchAlbum(id, opts){ // one album by id -> the shelf's album record
  return albumRecord(await api('/albums/' + id, opts));
}
function albumRecord(d){
  const tracks = (d.tracks && d.tracks.items || []).map(t => ({ title: t.name, uri: t.uri, preview: t.preview_url }));
  return { id: d.id, uri: d.uri, title: d.name, artist: d.artists.map(a => a.name).join(', '), cover: (d.images[1]||d.images[0]||{}).url, year: (d.release_date||'').slice(0,4), tracks };
}
async function runPendingImport(){
  let ids = null;
  try { ids = sessionStorage.getItem('plattenstube.import'); } catch (e) {}
  if (!ids) return;
  if (!auth) { setStatus('This link carries a record collection. Connect to Spotify to add it to your cabinet.'); return; }
  if (!isOwner) { try { sessionStorage.removeItem('plattenstube.import'); } catch (e) {} return; }
  const wanted = [...new Set(ids.split(',').filter(Boolean))].filter(id => !albums.some(a => a.id === id));
  try { sessionStorage.removeItem('plattenstube.import'); } catch (e) {}
  if (!wanted.length) { setStatus('All records from that link are already in your cabinet.'); return; }
  let added = 0, failed = 0;
  for (const id of wanted) {
    if (albums.length >= SLOTS) break;
    setStatus(`Adding records from the link… ${added + 1}/${wanted.length}`);
    try { const a = await fetchAlbum(id); albums.push(a); coverImage(a); added++; if (added % 5 === 0) { save(); renderShelf(); } }
    catch (e) { failed++; }
  }
  sortAlbums(); save(); renderShelf(); draw();
  setStatus(`Added ${added} record${added === 1 ? '' : 's'} from the link` + (failed ? ` (${failed} could not be found)` : '') + (albums.length >= SLOTS ? '; the cabinet is full now.' : '.'));
}
async function loadSharedCollection(){ // the cabinet comes from collection.json next to this page: the owner's records with title, artist, cover and all
  let list = null;
  try { const r = await fetch('collection.json', { cache: 'no-store' }); if (r.ok) { const d = await r.json(); list = Array.isArray(d) ? d : (d.albums || d.ids); } } catch (e) {}
  if (!list) return;                                                                // offline or not published: keep what we had
  const have = Object.fromEntries(albums.map(a => [a.id, a]));
  const seen = new Set(); albums = [];
  for (const e of list) {
    const rec = typeof e === 'string' ? { id: e } : e;                                // older files carry ids only; details come when the record is picked
    if (!rec || !/^[A-Za-z0-9]+$/.test(rec.id || '') || seen.has(rec.id)) continue; seen.add(rec.id);
    albums.push(have[rec.id] && have[rec.id].uri ? have[rec.id] : { ...rec, title: rec.title || '…', artist: rec.artist || '', tracks: rec.tracks || [] });
    if (albums.length >= SLOTS) break;
  }
  albums.forEach(a => { a.taken = false; coverImage(a); }); sortAlbums(); save(); renderShelf(); draw();
}
async function ensureAlbum(a){ // a record with only an id, or one added from a search result while Spotify was throttling: complete it the moment it is picked
  if (a.uri && !a.partial) return a;
  try {
    const full = albumRecord(await api('/albums/' + a.id, { quick: true }));
    Object.assign(a, full); delete a.partial; a.color = null; delete imgCache[a.id]; coverImage(a); sortAlbums(); save(); renderShelf();
    if (player.album === a && nowEl.querySelector('b')) renderNow(a, player.lastTrack || '', !player.playing);   // the panel picks up cover, title and artist too
  }
  catch (e) { if (!a.uri) a.failed = e.message; }                                  // a partial record plays fine as it is; we try again next time
  return a;
}
document.getElementById('export').onclick = () => { // owner: download collection.json for the server
  const albumsOut = albums.map(({ id, uri, title, artist, cover, year, tracks }) => ({ id, uri, title, artist, cover, year, tracks }));   // everything the room needs, so guests never have to ask Spotify for it
  const blob = new Blob([JSON.stringify({ albums: albumsOut })], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'collection.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  setStatus('collection.json saved — upload it next to plattenstube.html and guests will see this collection.');
};
document.getElementById('share').onclick = () => {
  const link = collectionLink(), btn = document.getElementById('share');

};
async function handleRedirect(){
  const u = new URL(location.href);
  const code = u.searchParams.get('code'), err = u.searchParams.get('error');
  if (!code && !err) return;
  history.replaceState(null, '', REDIRECT);
  if (err) { setStatus('Spotify login was cancelled (' + err + ').'); return; }
  try {
    await tokenRequest({ client_id: CLIENT_ID, grant_type: 'authorization_code', code, redirect_uri: REDIRECT, code_verifier: sessionStorage.getItem('plattenstube.verifier') || '' });
    setStatus('Connected to Spotify.');
  } catch (e) { setStatus('Spotify login failed: ' + e.message); }
}
async function token(){
  if (!auth) return null;
  if (Date.now() > auth.exp) {
    try { await tokenRequest({ client_id: CLIENT_ID, grant_type: 'refresh_token', refresh_token: auth.refresh }); }
    catch (e) { auth = null; saveAuth(); updateAuthUI(); return null; }
  }
  return auth.access;
}
async function api(path, opts = {}){
  const t = await token();
  if (!t) throw new Error('not logged in');
  let r = await fetch('https://api.spotify.com/v1' + path, { ...opts, headers: { Authorization: 'Bearer ' + t, 'Content-Type': 'application/json', ...(opts.headers||{}) } });
  if (r.status === 429) { // rate limited: wait as long as Spotify asks (up to two minutes), then try once more
    const secs = Math.min(opts.quick ? 6 : 120, parseInt(r.headers.get('Retry-After') || '3', 10) || 3), wait = secs * 1000 + 200;
    await new Promise(res => setTimeout(res, wait));
    r = await fetch('https://api.spotify.com/v1' + path, { ...opts, headers: { Authorization: 'Bearer ' + t, 'Content-Type': 'application/json', ...(opts.headers||{}) } });
  }
  if (r.status === 204) return null;
  const d = await r.json().catch(() => null);
  if (!r.ok) throw new Error(((d && d.error && d.error.message) || ('HTTP ' + r.status)) + ' – ' + path.split('?')[0]);   // which endpoint, for the error box
  return d;
}
let me = null;
async function updateAuthUI(){
  const who = document.getElementById('who');
  overlay.hidden = !!auth;
  document.getElementById('disconnect').hidden = !auth;
  q.disabled = !auth;
  if (!auth) { who.textContent = 'not connected'; who.style.color = 'var(--muted)'; leaveRoom(); return; }
  who.style.color = '';
  try {
    me = await api('/me'); who.textContent = `${me.display_name || me.id}`;
    isOwner = me.id === OWNER_ID && !guestView; document.body.classList.toggle('owner', isOwner);
    if (!isOwner || !albums.length) await loadSharedCollection();                 // guests get the owner's cabinet; the owner too, on a browser that has no cabinet yet (e.g. first visit on the website)
    initPlayer(); enterRoom();
  }
  catch (e) { who.textContent = 'Session problem: ' + e.message; }
}
document.getElementById('connect').onclick = login;
function finishLogout(){ auth = null; me = null; saveAuth(); updateAuthUI(); if (sdk.player) { sdk.player.disconnect(); sdk.player = null; sdk.device = null; } }
document.getElementById('disconnect').onclick = () => { // he puts the record back, walks out, and only then are you logged out
  if (!scene.manIn) { finishLogout(); return; }
  if (busy()) { setStatus('He will leave as soon as he is free.'); }
  const steps = [], edge = HER_SPOTS.edge;
  let at = standUp(steps);
  at = returnLegs(at, steps);                                                     // the record on the turntable goes back to its slot
  steps.push(...walkTo(at, edge));
  steps.push(wait(1200, () => { scene.man.facing = 1; }));
  steps.push(wait(600, () => { finishLogout(); }));                               // gone; the room is empty again
  if (busy()) anim.queue.push(...steps); else anim.queue = steps;
  document.getElementById('disconnect').disabled = true;
  setStatus('He is putting things away and heading out…');
};

/* ---------- search ---------- */
const q = document.getElementById('q'), results = document.getElementById('results');
let timer, searchSeq = 0;
q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(search, 350); });
q.addEventListener('keydown', e => { if (e.key === 'Escape') results.classList.remove('open'); if (e.key === 'Enter') { clearTimeout(timer); search(); } });
document.addEventListener('click', e => { if (!e.target.closest('.search')) results.classList.remove('open'); });
q.addEventListener('focus', () => { if (results.children.length) results.classList.add('open'); });
function setStatus(t){ /* the room tells the story; there is no status line */ }

async function search(){
  const text = q.value.trim();
  if (text.length < 2) { results.classList.remove('open'); return; }
  if (!auth) { setStatus('Connect to Spotify first.'); return; }
  const seq = ++searchSeq;
  setStatus('Searching Spotify…');
  let list;
  try {
    const d = await api('/search?type=album&limit=10&q=' + encodeURIComponent(text));
    list = d.albums.items.map(r => ({ id: r.id, uri: r.uri, title: r.name, artist: r.artists.map(a => a.name).join(', '), year: (r.release_date||'').slice(0,4),
      cover: (r.images[r.images.length-1]||{}).url, coverBig: (r.images[1]||r.images[0]||{}).url }));
  } catch (e) { if (seq === searchSeq) setStatus('Search failed: ' + e.message); return; }
  if (seq !== searchSeq) return;
  results.innerHTML = '';
  if (!list.length) { setStatus('No albums found.'); results.classList.remove('open'); return; }
  for (const r of list) {
    const el = document.createElement('div'); el.className = 'result'; el.tabIndex = 0;
    const have = albums.some(a => a.id === r.id);
    el.innerHTML = `<img alt=""><div class="t"><b></b><span></span></div><button class="add" ${have?'disabled':''}>${have?'ON SHELF':'ADD'}</button>`;
    el.querySelector('img').src = r.cover || '';
    el.querySelector('b').textContent = r.title;
    el.querySelector('span').textContent = r.artist + (r.year ? ' · ' + r.year : '');
    el.querySelector('.add').onclick = ev => { ev.stopPropagation(); addAlbum(r, el.querySelector('.add')); };
    el.onclick = () => { if (!have) addAlbum(r, el.querySelector('.add')); };
    results.appendChild(el);
  }
  results.classList.add('open');
  setStatus(`${list.length} results. Click one to add it to the cabinet.`);
}

async function addAlbum(r, btn){
  if (albums.length >= SLOTS) { setStatus(`The cabinet is full (${SLOTS} records). Remove one first.`); return; }
  btn.disabled = true; btn.textContent = 'FETCHING…';
  setStatus(`Fetching "${r.title}"…`);
  let a;
  try { a = await fetchAlbum(r.id, { quick: true }); if (!a.cover) a.cover = r.coverBig; }   // one album request brings title, cover and tracks… (no long waits when Spotify is throttling)
  catch (e) {                                                             // …and if Spotify refuses it, the search result already has what the room needs
    a = { id: r.id, uri: r.uri, title: r.title, artist: r.artist, cover: r.coverBig, year: r.year, tracks: [], partial: true };   // completed the next time it is picked
    nowMessage(`Added from the search result; Spotify would not give details (${e.message}).`);
  }
  if (albums.some(x => x.id === a.id)) { btn.textContent = 'ON SHELF'; return; }
  albums.push(a); sortAlbums(); save(); coverImage(a);
  btn.textContent = 'ON SHELF';
  renderShelf(); draw();
}

/* ---------- vinyl crackle: a few seconds of hiss and pops when the needle drops and when a side runs out ---------- */
const crackle = { ctx: null };
function playCrackle(ms){
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    if (!crackle.ctx) crackle.ctx = new AC();
    const ac = crackle.ctx; if (ac.state === 'suspended') ac.resume();
    const sr = ac.sampleRate, n = Math.floor(sr * ms / 1000), buf = ac.createBuffer(1, n, sr), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * 0.012;                                       // faint hiss
    const pops = Math.floor(ms / 140);
    for (let k = 0; k < pops; k++) { const at = Math.floor(Math.random() * (n - 400)), amp = 0.08 + Math.random()*0.18, len = 40 + Math.random()*260; for (let i = 0; i < len; i++) d[at+i] += (Math.random()*2-1) * amp * Math.exp(-i/(len/4)); } // pops and ticks
    const src = ac.createBufferSource(); src.buffer = buf;
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 900;
    const g = ac.createGain(); const t = ac.currentTime;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.15); g.gain.setValueAtTime(0.35, t + ms/1000 - 0.8); g.gain.exponentialRampToValueAtTime(0.0001, t + ms/1000);
    src.connect(hp); hp.connect(g); g.connect(ac.destination); src.start(t); src.stop(t + ms/1000 + 0.05);
  } catch (e) {}
}

function playScratch(){ // the needle skidding across the record: a short burst of filtered noise sweeping down, with a thump at the end
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    if (!crackle.ctx) crackle.ctx = new AC();
    const ac = crackle.ctx; if (ac.state === 'suspended') ac.resume();
    const sr = ac.sampleRate, ms = 420, n = Math.floor(sr * ms / 1000), buf = ac.createBuffer(1, n, sr), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * (0.6 + 0.4*Math.sin(i / sr * 2 * Math.PI * (60 - 40*i/n)));   // noise with a wobble that slows down
    const src = ac.createBufferSource(); src.buffer = buf;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 2.5;
    const t = ac.currentTime; bp.frequency.setValueAtTime(3200, t); bp.frequency.exponentialRampToValueAtTime(380, t + ms/1000);   // the skid sweeps downward
    const g = ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + ms/1000);
    src.connect(bp); bp.connect(g); g.connect(ac.destination); src.start(t); src.stop(t + ms/1000 + 0.05);
    const th = ac.createOscillator(), tg = ac.createGain(); th.type = 'sine'; th.frequency.setValueAtTime(90, t + 0.3); th.frequency.exponentialRampToValueAtTime(40, t + 0.5);   // the arm landing on its rest
    tg.gain.setValueAtTime(0.0001, t + 0.3); tg.gain.exponentialRampToValueAtTime(0.35, t + 0.32); tg.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
    th.connect(tg); tg.connect(ac.destination); th.start(t + 0.3); th.stop(t + 0.6);
    playCrackle(900);
  } catch (e) {}
}

/* ---------- playback: Spotify Web Playback SDK (Premium), preview fallback ---------- */
const player = { album: null, index: 0, audio: null, playing: false, mode: null, lastTrack: '', sdkPaused: false, needsClick: false };
/* ---------- whistling: starts at the earliest 30 s into the music, lasts 10–30 s, then a break ---------- */
const whistle = { on: false, next: Infinity, until: 0 };
const rnd = (a, b) => a + Math.random() * (b - a);
function whistleReset(){ whistle.on = false; whistle.next = performance.now() + rnd(30000, 45000); }
function whistleTick(now){
  if (!player.playing || !scene.man.sitting) { if (whistle.on) { whistle.on = false; whistle.next = now + rnd(30000, 45000); } return; }
  if (!whistle.on && now >= whistle.next) { whistle.on = true; whistle.until = now + rnd(10000, 30000); }
  else if (whistle.on && now >= whistle.until) { whistle.on = false; whistle.next = now + rnd(40000, 90000); }
}
const whistling = () => whistle.on && player.playing && scene.man.sitting && !talking() && !scene.doze;
const sdk = { player: null, device: null, ready: null, activated: false };
const nowEl = document.getElementById('now');
window.onSpotifyWebPlaybackSDKReady = () => { sdk.loaded = true; if (auth) initPlayer(); };
function initPlayer(){
  if (sdk.player || !window.Spotify) return;
  const p = new Spotify.Player({ name: 'Plattenstube', getOAuthToken: cb => token().then(t => cb(t)), volume: volume.level });
  sdk.ready = new Promise(res => p.addListener('ready', ({ device_id }) => { sdk.device = device_id; res(device_id); }));
  p.addListener('not_ready', () => { sdk.device = null; });
  p.addListener('autoplay_failed', () => { sdk.activated = false; soundFailed(); });   // the browser refused to start the sound
  sdk.watch = setInterval(watchSound, 1000);
  p.addListener('initialization_error', e => setStatus('Player error: ' + e.message));
  p.addListener('authentication_error', e => setStatus('Player auth error: ' + e.message));
  p.addListener('account_error', e => setStatus('Spotify Premium is needed for playback: ' + e.message));
  p.addListener('player_state_changed', st => {
    if (!st || !player.album) return;
    const t = st.track_window.current_track;
    player.sdkPaused = st.paused; player.stateAt = performance.now();
    if (player.playing && !st.paused) { player.stalled = 0; player.retried = false; }
    renderNow(player.album, t ? t.name : '', st.paused && !player.playing);        // the panel shows what the room shows; a short stall while the sound comes through is not a pause
    if (st.paused && st.position === 0 && st.track_window.previous_tracks.length && !st.track_window.next_tracks.length) endOfSide();
  });
  p.connect();
  sdk.player = p;
}
const stopBtn = document.getElementById('stop');
stopBtn.onclick = () => togglePlayback();
function renderNow(a, trackName, paused){ // the NOW PLAYING box: cover, title, track, artist; the Stop/Play button lives in the controls below
  nowEl.innerHTML = `<div class="t"><b></b><div class="track"></div><div class="artist"></div></div>`;
  nowEl.querySelector('b').textContent = a.title;
  nowEl.querySelector('.track').textContent = (paused ? '⏸ ' : '▶ ') + (trackName || '');
  nowEl.querySelector('.artist').textContent = a.artist + (a.year ? ' · ' + a.year : '');
  stopBtn.disabled = false; stopBtn.textContent = paused ? 'Play' : 'Stop';
  player.lastTrack = trackName;
}
function nowMessage(text, bad){ nowEl.innerHTML = `<span style="color:var(--${bad ? 'bad' : 'muted'})">${text}</span>`; stopBtn.disabled = true; stopBtn.textContent = 'Stop'; }
async function startPlayback(a, retry){
  player.album = a; player.index = 0; player.playing = true; renderShelf(); whistleReset(); scene.playSince = scene.t; scene.doze = false; scene.dozed = false;
  if (player.muted && sdk.player) { player.muted = false; sdk.player.setVolume(volume.level).catch(() => {}); }
  player.since = performance.now(); if (!retry) { player.retried = false; player.stalled = 0; }
  renderNow(a, 'starting…', false);
  // 1) Full album through Spotify Connect (Premium)
  if (sdk.player) {
    try {
      const dev = sdk.device || await Promise.race([sdk.ready, new Promise((_, rej) => setTimeout(() => rej(new Error('player not ready')), 8000))]);
      await sdk.player.activateElement();
      await api('/me/player/play?device_id=' + dev, { method: 'PUT', body: JSON.stringify({ context_uri: a.uri }) });
      player.mode = 'sdk';
      if (!sdk.straightened) { // a record plays in order, start to finish: no shuffle, no repeat (once per visit, the setting sticks to the device)
        sdk.straightened = true;
        api('/me/player/shuffle?state=false&device_id=' + dev, { method: 'PUT' }).catch(() => { sdk.straightened = false; });
        api('/me/player/repeat?state=off&device_id=' + dev, { method: 'PUT' }).catch(() => {});
      }
      return;                                                                       // from here on watchSound() keeps an eye on whether sound really comes
    } catch (e) { player.lastError = e.message; }
  }
  // 2) 30-second previews, if Spotify provides any for this album
  if (a.tracks.some(t => t.preview)) { player.mode = 'preview'; playPreview(); return; }
  if (sdk.player) { player.mode = 'sdk'; soundFailed(); return; }                   // the play command itself failed: same picture, the needle skids and the record stops
  player.mode = 'failed'; player.sdkPaused = true;
  renderNow(a, 'No audio: Spotify Premium is needed to play this record.', true);
}
function playPreview(){
  const a = player.album; if (!a) return;
  while (player.index < a.tracks.length && !a.tracks[player.index].preview) player.index++;
  if (player.index >= a.tracks.length) { endOfSide(); return; }
  if (player.audio) player.audio.pause();
  const t = a.tracks[player.index];
  const au = new Audio(t.preview); player.audio = au; au.volume = volume.level;
  au.onended = au.onerror = () => { player.index++; playPreview(); };
  au.play().catch(() => {});
  renderNow(a, `${player.index+1}/${a.tracks.length} · ${t.title} (preview)`, false);
}
function audioStop(){ // record comes off the turntable
  if (player.audio) { player.audio.pause(); player.audio = null; }
  if (player.mode === 'sdk' && sdk.player) sdk.player.pause().catch(() => {});
  player.playing = false; player.album = null; player.mode = null; renderShelf();
}
function audioPause(){ // arm lifted, record stays on
  if (player.mode === 'preview' && player.audio) player.audio.pause();
  if (player.mode === 'sdk' && sdk.player) sdk.player.pause().catch(() => {});
  player.playing = false;
  if (player.album) renderNow(player.album, player.lastTrack || '', true);
}
function audioResume(){ // arm lowered again
  const a = player.album; if (!a) return;
  player.playing = true; whistleReset(); scene.playSince = scene.t; player.since = performance.now(); player.retried = false;
  if (player.mode === 'preview' && player.audio) { player.audio.play().catch(() => {}); renderNow(a, player.lastTrack || '', false); }
  else if (player.mode === 'sdk' && sdk.player) { sdk.player.resume().catch(() => startPlayback(a)); if (player.muted) { player.muted = false; sdk.player.setVolume(volume.level).catch(() => {}); } renderNow(a, player.lastTrack || '', false); }
  else startPlayback(a);
}
function soundFailed(){ // the record is on and the arm is down, but no sound is coming: the needle skids, the arm jumps back, the record stops. Play (a real click) starts it again
  if (!player.playing) return;
  player.needsClick = false; player.sdkPaused = true; player.retried = false;
  playScratch();
  scene.armDown = false; player.playing = false; scene.runout = 0; whistleReset();
  if (sdk.player) sdk.player.pause().catch(() => {});
  if (player.album) renderNow(player.album, player.lastTrack && !/starting/.test(player.lastTrack) ? player.lastTrack : '', true);   // no message: the lifted arm says it all
}
async function watchSound(){ // once a second: does Spotify actually play while the room thinks it does? if not, try the play command once more, then give up with a skid
  if (player.mode !== 'sdk' || !player.playing || !sdk.player || scene.runout) return;
  if (performance.now() - (player.since || 0) < 6000) return;                      // give a fresh start a few seconds to come through
  let st = null; try { st = await sdk.player.getCurrentState(); } catch (e) {}
  if (st && !st.paused) { player.stalled = 0; player.retried = false; return; }
  if (!st) { // no state at all: the SDK does not know (yet) – only Spotify's own events can tell us it is paused
    if (!(player.stateAt > player.since && player.sdkPaused)) { player.stalled = 0; return; }
  }
  player.stalled = (player.stalled || 0) + 1;
  if (player.stalled < 4) return;
  player.stalled = 0;
  if (!player.retried && player.album) { player.retried = true; player.since = performance.now(); startPlayback(player.album, true); return; }   // once more, from the top
  soundFailed();
}
function endOfSide(){ // the album ran out: the record keeps turning in the run-out groove for a while, then he gets up and lifts the arm
  if (!player.playing) return;
  player.playing = false; scene.runout = scene.t + 7000; playCrackle(6500);
  if (!busy()) {
    const steps = [{ type: 'until', test: () => scene.t >= scene.runout }];
    const from = standUp(steps); steps.push(...walkTo(from, POS.tt)); steps.push(wait(400, () => { scene.armDown = false; scene.runout = 0; audioPause(); }));
    const others = albums.filter(a => a !== scene.record);                              // random picks come from the cabinet only, never from the framed playlists
    if (others.length) { // then he puts that one away and picks another at random
      const next = others[Math.floor(Math.random()*others.length)];
      steps.push(wait(900, () => {}));
      const at = returnLegs(POS.tt, steps);
      fetchLegs(next, at, steps);
    }
    sitDown(POS.tt, steps); anim.queue = steps;
  } else { scene.armDown = false; scene.runout = 0; }
}
function stopPlayback(){ // record removed from the shelf while on the turntable
  audioStop(); scene.record = null; scene.armDown = false; scene.man.hold = null;
  nowMessage('Record removed.');
}

/* ---------- scene / animation ---------- */
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const W = 400, H = 300; canvas.width = W; canvas.height = H;
function fit(){
  const box = canvas.parentElement.getBoundingClientRect();
  const s = Math.max(1, Math.floor(Math.min(box.width / W, box.height / H) * 2) / 2);   // half-step scaling keeps pixels mostly even while using the space
  canvas.style.width = (W*s) + 'px'; canvas.style.height = (H*s) + 'px';
}
addEventListener('resize', fit); fit();

// Isometric projection: +x goes down-right, +y goes down-left, +z goes up.
const CX = 212, CY = 112;
const P = (x,y,z) => [CX + x - y, CY + (x+y)/2 - z];
function poly(pts, fill){ ctx.fillStyle = fill; ctx.beginPath(); pts.forEach((p,i)=> i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); ctx.fill(); }
function shade(c, k){ // c = [r,g,b]
  return `rgb(${c[0]*k|0},${c[1]*k|0},${c[2]*k|0})`;
}
// box with corner (x,y,z), size (w,d,h). Draws top, +x side (left-dark), +y side (front).
function box(x,y,z,w,d,h,c, opts={}){
  const t = opts.top ?? 1.0, f = opts.front ?? 0.8, s = opts.side ?? 0.6;
  if (h>0) {
    poly([P(x+w,y,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x+w,y,z+h)], shade(c,s));
    poly([P(x,y+d,z),P(x+w,y+d,z),P(x+w,y+d,z+h),P(x,y+d,z+h)], shade(c,f));
  }
  poly([P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+d,z+h),P(x,y+d,z+h)], shade(c,t));
}
function shearBox(x,y,z,w,d,h,dx,dy,c){ // a box whose top stays put and whose bottom is shifted by (dx,dy): a limb rotated about its top end

/* ---------- time of day (real clock): darkness 0 by day, rising through dusk to 1 at night ---------- */
let clockOverride = null;                                     // hours, for testing
function hourNow(){ if (clockOverride !== null) return clockOverride; const d = new Date(); return d.getHours() + d.getMinutes()/60; }
function darkness(){ // 0 by day; dusk settles at 0.5 (18:00–20:00); night is 1 (21:00–6:00); the ramps in between take an hour or two
  const h = hourNow();
  if (h >= 21 || h < 6) return 1;
  if (h >= 20) return 0.5 + (h - 20) / 2;
  if (h >= 18) return 0.5;
  if (h >= 17) return (h - 17) / 2;
  if (h < 8) return 1 - (h - 6) / 2;
  return 0;
}
const evening = () => darkness() > 0.35;
const lamp = { on: darkness() > 0.35, trip: false, glow: darkness() > 0.35 ? 1 : 0 };   // when the page opens in the evening the lamp is already on
const candle = { lit: darkness() > 0.35 };                                             // only she lights it or puts it out
function sunGlow(){ // the orange-pink of a sunset (around 17:30) and a sunrise (around 7:00) in the sky outside: 0..1
  const h = hourNow(), peak = (c, w) => Math.max(0, 1 - Math.abs(h - c) / w);
  return Math.max(peak(17.6, 0.9), peak(7.0, 1.1));
}
const mood = { dark: darkness(), glow: sunGlow(), candle: darkness() > 0.35 ? 1 : 0, last: 0 };          // what is drawn: eases slowly toward the clock, so nothing ever snaps
function moodTick(now){
  const dt = Math.min(100, now - (mood.last || now)); mood.last = now;
  const k = 1 - Math.exp(-dt / 12000);                                                  // ~12 s time constant: a jump takes about half a minute to settle
  mood.dark += (darkness() - mood.dark) * k;
  mood.glow += (sunGlow() - mood.glow) * k;
  mood.candle += ((candle.lit ? 1 : 0) - mood.candle) * (1 - Math.exp(-dt / (candle.lit ? 2500 : 700)));   // the flame takes a few seconds to catch; blown out, it is gone in a moment
  lamp.glow += ((lamp.on ? 1 : 0) - lamp.glow) * (1 - Math.exp(-dt / 1800));             // the lamp warms up and fades down
}   // the cat's cushion, in front of the armchair just off the rug
const LEAFR = i => i === 1 ? 6 : 4;                      // how far the leaves reach beyond the pot
const NICHE = { x: -12, y: 34, w: 12, d: 44, h: 26 };          // the window niche: a recess 12 deep cut into the left wall, its floor 26 up — a seat with cushions, the window at its back

  { x0: 0, y0: NICHE.y+4, x1: 12, y1: NICHE.y+13, pad: 5 },                          // the pile of books on the floor under the window
  { x0: 0, y0: TTPOS.y, x1: TTPOS.x+36, y1: TTPOS.y+30, pad: 10 },                 // record player table (closed off to the wall)
  { x0: CHAIRPOS.x-6, y0: CHAIRPOS.y-4, x1: CHAIRPOS.x+28, y1: CHAIRPOS.y+26, pad: 10 }, // armchair
  { x0: LAMP.x-2, y0: LAMP.y-2, x1: LAMP.x+6, y1: LAMP.y+6, pad: 8 },                       // floor lamp

const AREA = { x0: 8, y0: 30, x1: 172, y1: 166 };
let avoid = null;                                                                     // the other person, while a path is being planned: {x, y, r}
function blocked(x, y){
  if (x < AREA.x0 || x > AREA.x1 || y < AREA.y0 || y > AREA.y1) return true;
  if (avoid && Math.hypot(x - avoid.x, y - avoid.y) < avoid.r) return true;
  if (OBST.some(o => x > o.x0-o.pad && x < o.x1+o.pad && y > o.y0-o.pad && y < o.y1+o.pad)) return true;
  return false;
}
function snap(p){ // nearest free grid node to a point
  const gx = Math.round(p.x/STEP), gy = Math.round(p.y/STEP);
  for (let r = 0; r < 12; r++) for (let dx = -r; dx <= r; dx++) for (let dy = -r; dy <= r; dy++) {
    if (Math.max(Math.abs(dx),Math.abs(dy)) !== r) continue;
    if (!blocked((gx+dx)*STEP, (gy+dy)*STEP)) return [gx+dx, gy+dy];
  }
  return [gx, gy];
}
function findPath(from, to){
  // 4-direction A* where each change of direction costs extra, so the result is a few long straight legs
  const TURN = 6, start = snap(from), goal = snap(to);
  const key = (x,y,d) => x+','+y+','+d, DIRS = [[1,0],[-1,0],[0,1],[0,-1]];
  const h = (x,y) => Math.abs(x-goal[0]) + Math.abs(y-goal[1]);
  const open = [{ x: start[0], y: start[1], d: -1, g: 0, f: h(start[0],start[1]) }], came = {}, best = {}, closed = {};
  while (open.length) {
    open.sort((a,b) => a.f-b.f); const c = open.shift(); const ck = key(c.x,c.y,c.d);
    if (closed[ck]) continue; closed[ck] = true;
    if (c.x === goal[0] && c.y === goal[1]) {
      const path = []; let k = ck;
      while (k) { const [x,y] = k.split(',').map(Number); path.push({ x: x*STEP, y: y*STEP }); k = came[k]; }
      return path.reverse();
    }
    DIRS.forEach(([dx,dy], di) => {
      const nx = c.x+dx, ny = c.y+dy;
      if (blocked(nx*STEP, ny*STEP)) return;
      const g = c.g + 1 + (c.d >= 0 && c.d !== di ? TURN : 0), nk = key(nx,ny,di);
      if (best[nk] !== undefined && g >= best[nk]) return;
      best[nk] = g; came[nk] = ck; open.push({ x: nx, y: ny, d: di, g, f: g + h(nx,ny) });

    if ((b.x-a.x)*(c.y-b.y) !== (b.y-a.y)*(c.x-b.x)) out.push(b);
  }
  out.push(path[path.length-1]); return out;
}
function walkTo(from, to){

  if (!blocked(to.x, to.y)) pts[pts.length-1] = to;            // a target inside an obstacle's margin ends at the nearest free spot instead
  const steps = [];
  for (let i = 1; i < pts.length; i++) {
    const d = Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y);
    if (d > 0.5) steps.push(go(pts[i-1], pts[i], d / WALK_SPEED));
  }
  return steps;
}

function returnLegs(from, steps){

  const candleDue = (candle.lit ? mood.dark > 0.12 : mood.dark > 0.3) !== candle.lit && now > her.candleNext;   // once the room is noticeably dim (or light again) she comes to see to the candle
  if (!candleDue && now < her.next && !herRequest) return;
  const pick = herRequest || (candleDue ? 'candle' : (scene.doze ? ['cat', 'read'] : ['cat', 'read', 'talk'])[Math.floor(Math.random()*(scene.doze ? 2 : 3))]); herRequest = null;   // she lets him sleep: no chat while he dozes
  const q = [], d = HER_SPOTS.edge;
  her.visible = true; her.x = d.x; her.y = d.y; her.facing = -1; her.act = pick; her.hold = null;
  q.push(wait(2000, () => {}));                                                        // appears at the edge, pauses, then sets off
  if (pick === 'read') {
    q.push(...herWalkTo(d, HER_SPOTS.read));
    q.push(wait(500, () => { her.pose = 'read'; her.x = -5; her.y = NICHE.y + 23; }));        // climbs into the niche and settles with her back to the jamb
    q.push(wait(25000 + Math.random()*25000, () => {}));                                // reads
    q.push(wait(500, () => { her.pose = null; her.x = HER_SPOTS.read.x; her.y = HER_SPOTS.read.y; }));
    q.push(...herWalkTo(HER_SPOTS.read, d));
  } else if (pick === 'cat') {
    q.push(...herWalkTo(d, HER_SPOTS.cat));
    q.push(wait(500, () => { her.facing = -1; her.crouch = 1; catMood.visitor = scene.t + 20000; }));
    q.push(wait(6000 + Math.random()*4000, () => { her.crouch = 0; }));                 // strokes the cat
    q.push(wait(400, () => {}));
    q.push(...herWalkTo(HER_SPOTS.cat, d));
  } else if (pick === 'candle') { // she lights the candle on the player's table, or puts it out in the morning
    const want = !candle.lit;
    q.push(...herWalkTo(d, HER_SPOTS.candle));
    q.push(wait(900, () => { her.facing = -1; if (want) her.reach = 1; else her.blow = 1; }));   // lighting: reaches over the little table with a match; putting out: leans in and blows
    q.push(wait(1400, () => { candle.lit = want; setStatus(want ? 'She lights the candle.' : 'She blows the candle out.'); }));
    q.push({ type: 'until', test: () => want ? mood.candle > 0.9 : mood.candle < 0.02 });   // she watches until the flame has caught, or is really out
    q.push(wait(900, () => { her.reach = 0; her.blow = 0; her.candleNext = scene.t + 60000; }));
    q.push(...herWalkTo(HER_SPOTS.candle, d));
  } else { // she comes over for a chat
    q.push(...herWalkTo(d, HER_SPOTS.talk));
    q.push(wait(600, () => { her.facing = -1; talk.start = scene.t; talk.until = scene.t + 10000 + Math.random()*10000; }));
    q.push({ type: 'until', test: () => !talking() });                                   // they chat for a while
    q.push(wait(1200, () => {}));
    q.push(...herWalkTo(HER_SPOTS.talk, d));
  }
  q.push(wait(1500, () => { her.facing = 1; }));                                        // a moment at the edge, then she is gone
  her.anim.queue = q;
}

/* ---------- rain on the window (plane x=0, y 72..118, z 62..103) ---------- */
const WIN = { x:-12, y0:36, y1:76, z0:30, z1:110 };              // the window pane is at the back of the niche                     // a tall window, towards the back corner; the record wall hangs to its left
const rain = { falling: [], sliding: [], lastT: 0 };
function updateRain(now){
  const dt = Math.min(50, now - (rain.lastT || now)); rain.lastT = now;
  // streaks falling outside, slightly slanted
  if (Math.random() < dt/14) rain.falling.push({ y: WIN.y0 + Math.random()*(WIN.y1-WIN.y0), z: WIN.z1 + 4, v: 0.09 + Math.random()*0.05, len: 3 + Math.random()*4 });
  for (const d of rain.falling) { d.z -= d.v*dt; d.y += d.v*dt*0.12; }
  rain.falling = rain.falling.filter(d => d.z > WIN.z0 - 2);
  // drops hitting the glass: splash, then slide down with a trail
  if (Math.random() < dt/220) rain.sliding.push({ y: WIN.y0 + 2 + Math.random()*(WIN.y1-WIN.y0-4), z: WIN.z0 + 6 + Math.random()*(WIN.z1-WIN.z0-8), age: 0, v: 0.006 + Math.random()*0.012, trail: [], wob: Math.random()*6.28 });
  for (const d of rain.sliding) {
    d.age += dt;
    if (d.age > 350) { // after the splash it starts sliding, speeding up, wobbling sideways
      d.v = Math.min(0.045, d.v + dt*0.00002);
      d.z -= d.v*dt;
      d.trail.push({ y: d.y, z: d.z, life: 1 });
    }
    for (const t of d.trail) t.life -= dt/900;
    d.trail = d.trail.filter(t => t.life > 0);
    if (d.trail.length > 40) d.trail.shift();
  }
  rain.sliding = rain.sliding.filter(d => d.z > WIN.z0 || d.trail.length);
}
function px(y, z, w, h, fill){ // one "pixel" rectangle on the window plane
  const [sx, sy] = P(0, y, z); ctx.fillStyle = fill; ctx.fillRect(Math.round(sx), Math.round(sy), w, h);
}
function drawRain(){
  ctx.save();
  ctx.beginPath(); const c = [P(WIN.x,WIN.y0,WIN.z0),P(WIN.x,WIN.y1,WIN.z0),P(WIN.x,WIN.y1,WIN.z1),P(WIN.x,WIN.y0,WIN.z1)];
  ctx.moveTo(c[0][0],c[0][1]); c.slice(1).forEach(p => ctx.lineTo(p[0],p[1])); ctx.closePath(); ctx.clip();
  for (const d of rain.falling) for (let i=0;i<d.len;i++) px(d.y - i*0.12, d.z + i, 1, 1, i ? 'rgba(170,195,220,.35)' : 'rgba(210,228,245,.8)');
  for (const d of rain.sliding) {
    for (const t of d.trail) px(t.y, t.z, 1, 1, `rgba(160,190,220,${0.35*t.life})`);
    if (d.age < 350) { // splash: a small cross that fades
      const k = 1 - d.age/350;
      px(d.y, d.z, 2, 2, `rgba(230,240,255,${0.9*k})`);
      px(d.y-1.5, d.z, 1, 1, `rgba(230,240,255,${0.6*k})`); px(d.y+1.5, d.z, 1, 1, `rgba(230,240,255,${0.6*k})`);
      px(d.y, d.z+1.5, 1, 1, `rgba(230,240,255,${0.6*k})`);
    } else if (d.z > WIN.z0) {
      px(d.y, d.z, 2, 3, 'rgba(225,238,250,.95)'); px(d.y, d.z+1.5, 1, 1, 'rgba(255,255,255,.9)');
    }
  }
  // soft glare on the glass
  ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.fillRect(c[3][0]+2, c[3][1]+2, 10, 22);
  ctx.restore();
}

  nicheClip(() => { // the niche: an opening in the wall; everything inside it is seen only through that opening

    poly([P(-D,y,h),P(-D,y+d,h),P(-D,y+d,top),P(-D,y,top)], shade(PLY, 0.85));           // back panel
    poly([P(-D,y,h),P(0,y,h),P(0,y,top),P(-D,y,top)], shade(PLY, 0.72));                  // the reveal we can see

  poly([P(Wx,Wy0-2,Wz0-2),P(Wx,Wy1+2,Wz0-2),P(Wx,Wy1+2,Wz1+2),P(Wx,Wy0-2,Wz1+2)], '#2c3540');
  { const k = mood.dark, g = mood.glow, day = [74,94,115], dusk = [44,62,112], night = [14,16,26];   // grey afternoon -> blue dusk -> black night (eased)
    const base = k < 0.5 ? day.map((v,i) => v + (dusk[i]-v) * k*2) : dusk.map((v,i) => v + (night[i]-v) * (k-0.5)*2);

    poly([P(Wx,Wy0,Wz0),P(Wx,Wy1,Wz0),P(Wx,Wy1,Wz1),P(Wx,Wy0,Wz1)], col(base));
    if (g > 0.01) { // sunset / sunrise: the sky goes orange low down and pink higher up, over the grey-blue
      const top = [214,118,142], bottom = [238,146,78], mix = (a, b, t) => a.map((v,i) => v + (b[i]-v)*t);
      const bands = 6;
      for (let i = 0; i < bands; i++) { const z0 = Wz0 + (Wz1-Wz0)*i/bands, z1 = Wz0 + (Wz1-Wz0)*(i+1)/bands, t = 1 - i/(bands-1);
        const c = mix(base, mix(top, bottom, t), g * (0.55 + 0.35*t));

  drawRain();
  { const ym = (Wy0+Wy1)/2;                                                                 // mullions: one upright, three across → eight panes, as tall as the record wall
    poly([P(Wx,ym-1.5,Wz0),P(Wx,ym+1.5,Wz0),P(Wx,ym+1.5,Wz1),P(Wx,ym-1.5,Wz1)], '#2c3540');
    for (let k = 1; k < 4; k++) { const z = Wz0 + (Wz1-Wz0)*k/4; poly([P(Wx,Wy0,z-1),P(Wx,Wy1,z-1),P(Wx,Wy1,z+1),P(Wx,Wy0,z+1)], '#2c3540'); } }
  });
  drawWallRecords();

  // rug

  poly([P(56,86,0),P(144,86,0),P(144,144,0),P(56,144,0)], '#a85c4a');

function drawWallRecords(){ // three sleeves in thick wooden frames, one above the other on the left wall; an empty frame stays while one is on the turntable
  for (const w of FRAMED) {
    const { y0, z0 } = w, S = 12, T = 2.5, D = 2;                                                     // sleeve size, frame width, how far the frame stands out from the wall
    const q = (y, z) => P(0, y, z);
    poly([q(y0+S, z0+S), q(y0, z0+S), q(y0, z0), q(y0+S, z0)], shade(WOODD, 0.9));                       // wooden backing, seen while the sleeve is away
    if (!w.taken) {

      ctx.save(); ctx.transform(1, -0.5, 0, 1, sx, sy);                                                // image x runs along the wall, image y down the wall
      if (img.complete && img.naturalWidth) { try { ctx.drawImage(img, 0, 0, S, S); } catch (e) { ctx.fillStyle = w.color || '#888'; ctx.fillRect(0, 0, S, S); } }
      else { ctx.fillStyle = w.color || '#888'; ctx.fillRect(0, 0, S, S); }

function wallAt(mx, my){ // which framed record is under the pointer
  for (const w of FRAMED) {

    const { y0, z0 } = w, S = 12, [x0,yy0] = P(0, y0+S, z0+S), [x1,yy1] = P(0, y0, z0+S), [x3,yy3] = P(0, y0+S, z0);
    const ux=x1-x0, uy=yy1-yy0, vx=x3-x0, vy=yy3-yy0, det=ux*vy-uy*vx;
    const u=((mx-x0)*vy-(my-yy0)*vx)/det, v=((my-yy0)*ux-(mx-x0)*uy)/det;

}

    if (scene.doze) { ctx.fillStyle = '#f1e4c8'; ctx.font = '9px VT323'; for (let i=0;i<2;i++){ const ph=(t/1800 + i/2)%1; const [nx,ny]=P(x+14,y-2,44+ph*16); ctx.globalAlpha=0.9*(1-ph); ctx.fillText('z', nx+ph*5, ny); } ctx.globalAlpha = 1; }
    if (dp >= 0) {                             // drinking: the near arm carries the mug from the armrest to the mouth and back

      const k = dp < 0.3 ? dp/0.3 : dp < 0.75 ? 1 : 1-(dp-0.75)/0.25;   // 0 = at the armrest, 1 = at the mouth

      const zb = z+12+breath + k*((hz-1.5) - (z+12+breath));                 // the elbow end rises to the forearm's height
      shearBox(x+14,y-4,zb,3,5,(z+25+breath)-zb, -2.5*k, 5*k, CARD2);        // upper arm, hinged at the shoulder, leaning toward the forearm
      box(Math.min(x+14,hx-1),hy-2.5,hz-1.5,Math.abs(hx-1-(x+14))+3,3,2.5,CARD2); // forearm reaching to the mug
      box(hx-1,hy-1,hz-1,3,3,3,SKIN);                                       // hand

    }
  } else {
    const x = m.x-7, y = m.y-7, z = bob;
    box(x+2,y+2,z,4,10,10,TROUS); box(x+8,y+2,z,4,10,10,TROUS);   // legs
    box(x+2,y+9,0,4,4,3,SHOE); box(x+8,y+9,0,4,4,3,SHOE);
    (m.hold ? armHold : armStand)(x-3, y, z);                      // far arm, behind the torso
    box(x,y,z+10,14,14,18,CARD);                                   // torso (knit sweater)
    for (let k=0;k<3;k++) box(x+2+k*4,y+13.7,z+12,1,0.5,12,CARD2); // knit ribs
    (m.hold ? armHold : armStand)(x+14, y, z);                     // near arm
    if (m.hold) {

      const a = m.hold, img = coverImage(a);
      const [sx,sy] = P(x-1, y+14, z+30);

}
function armSit(ax, y, z){        // upper arm down the side, forearm forward onto the thigh, hand on the knee
  box(ax,y-4,z+12,3,5,13,CARD2);
  box(ax,y+1,z+10,3,8,3,CARD2);
  box(ax,y+8,z+9,3,4,4,SKIN);
}
function armHold(ax, y, z){       // upper arm down the side, forearm reaching forward to the sleeve (hands are drawn on the sleeve)
  box(ax,y+4,z+19,3,5,9,CARD2);
  box(ax,y+8,z+16,3,7,3,CARD2);
}
function armStand(ax, y, z){      // arm hanging down the side
  box(ax,y+4,z+13,3,6,15,CARD2);
  box(ax,y+5,z+9,3,4,4,SKIN);
}
function head(x,y,z){
  box(x,y,z,10,10,10,SKIN);                   // head
  box(x,y+9,z,10,1,3,BEARD);                  // short dark beard on the front
  box(x+9,y+1,z,1,9,3,BEARD);                 // beard along the jaw (visible side)
  if (talking()) { const open = speaker() === 'him' && (scene.t % 480) < 260; box(x+2.5,y+9.6,z+1.8,5,0.6, open ? 1.6 : 0.9,[196,120,110]); } // a broad happy smile, moving as he talks
  else if (whistling() || scene.man.sitting && (d => d > 0.3 && d < 0.75)(drinkPhase(scene.t))) box(x+4,y+9.6,z+1.8,2,1.6,2,[214,160,128]); // pursed lips while whistling or sipping
  else box(x+3,y+9.5,z+2.2,4,1,0.8,[150,110,100]); // mouth
  const eh = scene.doze ? 0.35 : (scene.t % 4700) < 130 ? 0.4 : 1.5;       // blink now and then; closed while dozing
  box(x+2,y+9.6,z+5.5,1.5,0.6,eh,[40,30,28]); box(x+6.5,y+9.6,z+5.5,1.5,0.6,eh,[40,30,28]); // eyes
  box(x+1,y+9.4,z+8,8,0.6,1,BEARD);           // a bit of dark hair under the cap
  box(x-0.5,y-0.5,z+9,11,11,2,HAT);           // baseball cap, crown
  box(x+1.5,y+1.5,z+11,7,7,1,HAT);            // dome
  box(x-0.5,y+10,z+9,11,4,0.8,HAT);           // curved brim, front only
  box(x+4,y+10.1,z+9.5,2,0.6,1.2,[96,70,46]); // small dark logo on the front

let hover = null, hoverTop = false;                             // hoverTop: the pointer rests on the cabinet top, where a click picks a record at random (no label, just the pointer cursor)
function draw(){
  ctx.imageSmoothingEnabled = false;
  drawRoom();
  drawCabinet();
  // things in front, painted back to front by their floor footprints
  const m = scene.man;
  const manBox = m.sitting ? { x0: m.x+1, y0: m.y+1, x1: m.x+13, y1: m.y+18 } : { x0: m.x-6, y0: m.y-6, x1: m.x+6, y1: m.y+6 };
  const items = [
    { box: { x0: NICHE.x, y0: NICHE.y, x1: NICHE.x+NICHE.w, y1: NICHE.y+NICHE.d }, f: drawNiche, niche: true },
    { box: { x0: PLANTS[1][0]-14, y0: PLANTS[1][1]+4, x1: PLANTS[1][0]-2, y1: PLANTS[1][1]+12 }, f: () => BOOKS.filter(b => b.spot === 'plant').forEach(drawBook) },
    { box: { x0: 0, y0: NICHE.y+4, x1: 13, y1: NICHE.y+13 }, f: () => BOOKS.filter(b => b.spot === 'floor').forEach(drawBook) },
    { box: { x0: TTPOS.x, y0: TTPOS.y, x1: TTPOS.x+36, y1: TTPOS.y+32 }, f: drawTurntable },
    { box: { x0: LAMP.x-3, y0: LAMP.y-3, x1: LAMP.x+7, y1: LAMP.y+7 }, f: drawLamp },
    ...PLANTS.map(([x,y],i) => ({ box: { x0: x-LEAFR(i), y0: y-LEAFR(i), x1: x+10+LEAFR(i), y1: y+10+LEAFR(i) }, f: () => drawPlant(x, y, i === 1), plantFront: i !== 0, plantBack: i === 0 })),
    { box: { x0: CHAIRPOS.x-6, y0: CHAIRPOS.y-4, x1: CHAIRPOS.x+23, y1: CHAIRPOS.y+26 }, f: drawChair, chair: true },
    { box: { x0: CHAIRPOS.x+23, y0: CHAIRPOS.y+2, x1: CHAIRPOS.x+28, y1: CHAIRPOS.y+26 }, f: drawChairArm },
    { box: { x0: CATPOS.x, y0: CATPOS.y, x1: CATPOS.x+CATPOS.w, y1: CATPOS.y+CATPOS.d }, f: scene.manIn ? drawCat : drawCushion },
    ...(scene.manIn ? [{ box: manBox, f: drawMan, man: true }] : []),
    ...(her.visible ? [{ box: { x0: her.x-6, y0: her.y-6, x1: her.x+6, y1: her.y+6 }, f: drawHer, her: true }] : []),
  ];
  // a is in front of b when a lies entirely at larger x or larger y (both axes point toward the viewer)
  const inFront = (a, b) => {
    if (a.her && her.pose === 'read' && b.niche) return true;   // reading on the window seat: in front of it
    if (b.her && her.pose === 'read' && a.niche) return false;
    if (a.man && m.sitting && b.chair) return true;   // sitting: always on the seat, in front of the backrest
    if (b.man && m.sitting && a.chair) return false;
    if ((a.man || a.her) && b.plantFront) return false;   // the two plants near the rug are always in front of the people
    if ((b.man || b.her) && a.plantFront) return true;
    if ((a.man || a.her) && b.plantBack) return true;     // the plant by the cabinet is always behind them
    if ((b.man || b.her) && a.plantBack) return false;
    const aF = a.box.x0 >= b.box.x1 - 0.5 || a.box.y0 >= b.box.y1 - 0.5; // a entirely nearer on one axis
    const bF = b.box.x0 >= a.box.x1 - 0.5 || b.box.y0 >= a.box.y1 - 0.5;
    if (aF !== bF) return aF;                          // one clear answer
    return (a.box.x1 + a.box.y1) > (b.box.x1 + b.box.y1); // overlapping, or nearer on different axes: compare near corners
  };
  const order = [];
  const left = items.slice();
  while (left.length) { // pick an item that nothing else in the pool is behind of → draw it next
    let pick = left.findIndex(a => left.every(b => a === b || !inFront(a, b)));
    if (pick < 0) { // contradictory pair somewhere: take the item with the farthest near corner
      let best = Infinity; left.forEach((a, i) => { const k = a.box.x1 + a.box.y1; if (k < best) { best = k; pick = i; } });
    }
    order.push(left.splice(pick, 1)[0]);
  }
  order.forEach(i => i.f());
  if (volume.atPlayer) { // a little level bar above the record player while he adjusts it
    const [bx, by] = P(TTPOS.x+18, TTPOS.y+13, 44), w = 22, x0 = Math.round(bx - w/2), y0 = Math.round(by);
    ctx.fillStyle = '#2a211a'; ctx.fillRect(x0-1, y0-1, w+2, 5);
    ctx.fillStyle = '#5a4632'; ctx.fillRect(x0, y0, w, 3);
    ctx.fillStyle = '#e5a24a'; ctx.fillRect(x0, y0, Math.round(w * volume.level), 3);
  }
  drawQuote();
  // music notes while playing: from the record player, and from him whistling along in the chair
  if (whistling()) {
    const m = scene.man;
    ctx.fillStyle = '#f1e4c8'; ctx.font = '8px VT323';
    for (let i=0;i<2;i++){ const ph=(scene.t/1500 + i/2)%1; const [nx,ny]=P(m.x+7,m.y+8,37+ph*20); ctx.globalAlpha=0.9*(1-ph); ctx.fillText(i?'♪':'♫', nx-3-ph*8+Math.sin(ph*5)*2, ny); }
    ctx.globalAlpha = 1;
  }
  if (player.playing) {
    ctx.fillStyle = '#f1e4c8'; ctx.font = '10px VT323';
    for (let i=0;i<3;i++){ const ph=(scene.t/1200 + i/3)%1; const [nx,ny]=P(TTPOS.x+15,TTPOS.y+13,34+ph*40); ctx.globalAlpha=1-ph; ctx.fillText('♪', nx-4+Math.sin(ph*6)*4, ny); }
    ctx.globalAlpha = 1;
  }
  // evening: the room darkens and the lamp carries the mood with a warm pool of light
  const dk = mood.dark, gl = lamp.glow;
  if (mood.glow > 0.01) { // low sun through the window: a faint warm wash over the room, strongest near the window
    const [wx, wy] = P(WIN.x, (WIN.y0+WIN.y1)/2, (WIN.z0+WIN.z1)/2); const g = ctx.createRadialGradient(wx, wy, 10, wx, wy, 260);
    g.addColorStop(0, `rgba(255,150,80,${0.22*mood.glow})`); g.addColorStop(1, `rgba(255,150,80,${0.06*mood.glow})`);

  }
  if (dk > 0.005) {
    const shade = (0.08 + 0.62 * dk * dk) * (1 - 0.55 * mood.glow);       // dusk (0.5) is a gentle blue dimming, night (1) is properly dark; the sunset glow holds it back
    const tint = dk < 0.5 ? [40,52,92] : [40,52,92].map((v,i) => v + ([18,12,30][i]-v) * (dk-0.5)*2);   // blue at dusk, near-black at night
    const T = tint.map(v=>v|0).join(',');

    const g = ctx.createRadialGradient(lx, ly, 8, lx, ly, 150);            // the pool of light opens up as the lamp warms
    g.addColorStop(0, `rgba(${T},${shade*(1 - 0.85*gl)})`); g.addColorStop(0.35, `rgba(${T},${shade*(1 - 0.45*gl)})`); g.addColorStop(1, `rgba(${T},${shade})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    if (gl > 0.02) { const w = ctx.createRadialGradient(lx, ly, 2, lx, ly, 70); w.addColorStop(0, `rgba(255,190,110,${0.22*dk*gl})`); w.addColorStop(1, 'rgba(255,190,110,0)'); ctx.fillStyle = w; ctx.fillRect(0, 0, W, H); }
    if (gl > 0.02) { // the small lamp on the cabinet makes its own little pool of light up there
      const [sx, sy] = P(CAB.x+123, CAB.y+13, CAB.h+14); const w = ctx.createRadialGradient(sx, sy, 2, sx, sy, 34);
      w.addColorStop(0, `rgba(255,205,130,${0.5*dk*gl})`); w.addColorStop(0.5, `rgba(255,195,120,${0.18*dk*gl})`); w.addColorStop(1, 'rgba(255,190,110,0)'); ctx.fillStyle = w; ctx.fillRect(0, 0, W, H); }
    if (mood.candle > 0.03) { const [cx, cy] = P(TTPOS.x+31, TTPOS.y+26.5, 29); const c = ctx.createRadialGradient(cx, cy, 2, cx, cy, 40); c.addColorStop(0, `rgba(255,170,90,${0.28*dk*mood.candle})`); c.addColorStop(1, 'rgba(255,170,90,0)'); ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
  }

}

// click / hover on cabinet covers
function slotAt(mx,my){
  for (let i=0;i<albums.length;i++){
    const s = slotRect(i), fy = s.y;
    if (albums[i].taken) continue;
    const [x0,y0] = P(s.x-1,fy,s.z+s.h), [x1,y1]=P(s.x+s.w+1,fy,s.z+s.h), [x3,y3]=P(s.x-1,fy,s.z);
    // parallelogram: p = x0 + u*(x1-x0) + v*(x3-x0)
    const ux=x1-x0, uy=y1-y0, vx=x3-x0, vy=y3-y0, det=ux*vy-uy*vx;
    const u=((mx-x0)*vy-(my-y0)*vx)/det, v=((my-y0)*ux-(mx-x0)*uy)/det;
    if (u>=0&&u<=1&&v>=0&&v<=1) return i;
  }
  return -1;
}
function canvasPos(e){ const r=canvas.getBoundingClientRect(); return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]; }
function setHover(a){ if (hover === a) return; hover = a; renderPick(); shelfEl.querySelectorAll('.album').forEach((el,i) => el.classList.toggle('hover', albums[i] === a)); }
const pickEl = document.getElementById('pick');
function renderPick(){
  const a = hover;
  if (!a) { pickEl.innerHTML = '<div class="pick-empty">Hover a record or a book to see what it is. Click a record and he puts it on.</div>'; return; }
  pickEl.innerHTML = '<img alt=""><div class="t"><b></b><span></span><span></span></div>';
  const img = pickEl.querySelector('img'); if (a.cover) img.src = a.cover; else if (a.book) { img.style.background = `rgb(${a.color.join(',')})`; }
  pickEl.querySelector('b').textContent = a.title;
  const sp = pickEl.querySelectorAll('span');
  if (a.book) { sp[0].textContent = a.author + (a.year ? ' · ' + a.year : ''); sp[1].textContent = 'book'; return; }
  sp[0].textContent = a.artist + (a.year ? ' · ' + a.year : ''); sp[1].textContent = (a.trackCount || a.tracks.length) + ' tracks' + (a.wall ? ' · playlist' : '');
}
function onTurntable(mx, my){ // screen-space test against the plinth top (a bit enlarged)
  const pts = [P(TTPOS.x-2,TTPOS.y-2,27),P(TTPOS.x+38,TTPOS.y-2,27),P(TTPOS.x+38,TTPOS.y+32,27),P(TTPOS.x-2,TTPOS.y+32,27)];
  ctx.beginPath(); pts.forEach((p,i) => i ? ctx.lineTo(p[0],p[1]) : ctx.moveTo(p[0],p[1])); ctx.closePath();
  return ctx.isPointInPath(mx, my);
}
function onCabinetTop(mx, my){ // the top face of the cabinet
  const {x,y,w,d,h} = CAB, pts = [P(x-2,y-2,h+3),P(x+w+2,y-2,h+3),P(x+w+2,y+d+2,h+3),P(x-2,y+d+2,h+3)];
  ctx.beginPath(); pts.forEach((p,i) => i ? ctx.lineTo(p[0],p[1]) : ctx.moveTo(p[0],p[1])); ctx.closePath();
  return ctx.isPointInPath(mx, my);
}
function playRandom(){ // he puts the current record away and picks another at random (the framed ones on the wall included)
  const others = albums.filter(a => a !== scene.record);                        // cabinet only, no playlists
  if (!others.length || busy() || !scene.manIn) return;
  selectRecord(others[Math.floor(Math.random() * others.length)]);
}
function onSleeve(mx, my){ // the sleeve leaning against the record player's table (the record that is on)
  if (!scene.record) return false;
  const {x, y} = TTPOS, [sx, sy] = P(x+5, y+30.6, 15), m = [1, 0.5, -0.22, 1.08];       // same transform as when it is drawn: p = origin + u*(a,b) + v*(c,d), u,v in 0..15
  const det = m[0]*m[3] - m[2]*m[1], dx = mx - sx, dy = my - sy;
  const u = (dx*m[3] - m[2]*dy) / det, v = (m[0]*dy - m[1]*dx) / det;
  return u >= 0 && u <= 15 && v >= 0 && v <= 15;
}
function onMug(mx, my){ // the mug standing on the armrest
  if (drinkPhase(scene.t) >= 0) return false;
  const [sx, sy] = P(CHAIRPOS.x+25.5, CHAIRPOS.y+16, 19.5);
  return Math.abs(mx - sx) <= 4 && Math.abs(my - sy) <= 5;
}
function sipNow(){ if (scene.man.sitting && !busy() && drinkPhase(scene.t) < 0) { drink.start = scene.t; setStatus('A sip of tea.'); } }
canvas.addEventListener('mousemove', e => { const [x,y]=canvasPos(e); const i=slotAt(x,y), w = i < 0 ? wallAt(x,y) : null, bk = i < 0 && !w ? bookAt(x,y) : null, sl = i < 0 && !w && !bk && onSleeve(x,y); setHover(i>=0?albums[i]:(w || bk || (sl ? scene.record : null))); if (bk) lookupBook(bk); const top = i < 0 && !w && !bk && onCabinetTop(x,y); hoverTop = top; canvas.style.cursor = (i>=0 || w || bk || top || onTurntable(x,y) || onMug(x,y)) ? 'pointer' : 'default'; });
canvas.addEventListener('mouseleave', () => { setHover(null); hoverTop = false; });
document.addEventListener('pointerdown', () => { // browsers only let the player make sound after a tap: use the first one to unlock it, and resume if a record was waiting for that
  if (!sdk.player) return;
  if (!sdk.activated) { sdk.activated = true; sdk.player.activateElement().catch(() => { sdk.activated = false; }); }
}, { passive: true });
canvas.addEventListener('click', e => { if (!scene.manIn) return; const [x,y]=canvasPos(e); const i=slotAt(x,y); const w = i < 0 ? wallAt(x,y) : null, bk = i < 0 && !w ? bookAt(x,y) : null; if (i>=0) selectAlbum(i); else if (w) selectRecord(w); else if (bk) readBook(bk); else if (onCabinetTop(x,y)) playRandom(); else if (onMug(x,y)) sipNow(); else if (onTurntable(x,y)) togglePlayback(); });

function loop(now){
  scene.t = now;
  stepAnim(now);
  herTick(now);
  volumeTick(now);
  lampTick(now);
  dozeTick(now);
  readTick(now);
  moodTick(now);
  updateRain(now);
  whistleTick(now);
  drinkTick(now);
  if (player.playing || scene.runout) scene.angle += 0.08;
  draw();
  requestAnimationFrame(loop);
}
albums.forEach(a => { a.taken = false; coverImage(a); });
sortAlbums();
renderShelf();
requestAnimationFrame(loop);
pendingImportFromHash();
handleRedirect().then(updateAuthUI).then(runPendingImport);
if (!auth) setStatus('Connect to Spotify to open the room.');
